# 默认分类与标签配置
# 格式：以 [分类名] 作为分类标题，其下方每行写一个标签（空行与 # 开头的注释会被忽略）。
# 例如：
#   [开发]
#   前端
#   后端
# 作用：
#   1) 每次服务启动时会读取本文件，把数据库中「尚未存在」的分类与标签自动补建进去（幂等）。
#   2) 配置中存在的分类/标签在管理后台删除时会被拦截（不允许删除）。
# 维护方式：直接在此增删分类与标签即可，重启服务生效。
# 注意：每个分类下的标签归该分类所有；同名标签若在不同分类下会被视为不同标签。
[默认]

#[开发]
#前端
#后端
