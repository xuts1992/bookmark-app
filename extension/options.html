<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页收藏助手 - 规则管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: #f5f5fa;
    color: #222;
  }
  header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 22px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .hd-main h1 { margin: 0 0 6px; font-size: 18px; }
  .hd-main .sub { margin: 0; opacity: 0.85; font-size: 13px; }
  .hd-clear {
    flex-shrink: 0;
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .hd-clear:hover { background: rgba(255, 255, 255, 0.22); }
  main { max-width: 760px; margin: 22px auto; padding: 0 16px; }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    padding: 16px;
  }
  .hint { font-size: 12px; color: #888; margin: 0 0 12px; }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f4;
  }
  .row:last-child { border-bottom: none; }
  .row .key {
    width: 130px;
    flex-shrink: 0;
    font-weight: 600;
    color: #555;
    font-family: Consolas, Menlo, monospace;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-top: 8px;
  }
  .row textarea {
    flex: 1;
    min-height: 64px;
    padding: 8px 10px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 12px;
    font-family: Consolas, Menlo, monospace;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    white-space: pre;
    overflow-x: auto;
  }
  .row textarea:focus { border-color: #667eea; }
  .row .del {
    flex-shrink: 0;
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: #ffecec;
    color: #e74c3c;
    font-size: 12px;
    cursor: pointer;
  }
  .row .del:hover { background: #ffd9d9; }
  .empty { color: #999; text-align: center; padding: 22px 0; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .primary:hover { opacity: 0.9; }
  .secondary { background: linear-gradient(135deg, #2ed573, #1e90ff); color: #fff; }
  .secondary:hover { opacity: 0.9; }
  .tertiary { background: linear-gradient(135deg, #f7971e, #ffb347); color: #333; }
  .tertiary:hover { opacity: 0.9; }
  .danger { background: #fff; color: #e74c3c; border: 1.5px solid #e74c3c !important; }
  .danger:hover { background: #ffecec; }
  #status {
    margin-top: 12px;
    min-height: 18px;
    font-size: 13px;
    text-align: center;
  }
  #status.ok { color: #2ed573; }
  #status.error { color: #e74c3c; }
</style>
</head>
<body>
  <header>
    <div class="hd-main">
      <h1>📚 网页收藏助手 · 规则管理</h1>
      <p class="sub">管理提取规则：可导出为 JSON 文件分享给他人，或导入他人导出的规则文件</p>
    </div>
    <button id="clear" class="hd-clear" title="清空 chrome.storage.local 全部数据（不可恢复）">🗑 清空全部</button>
  </header>
  <main>
    <div class="card">
      <p class="hint">下面是当前保存的提取规则（按网站域名分组），可直接修改后「保存全部」，或单独删除某个网站的记录。</p>
      <div id="rows"></div>
      <div class="actions">
        <button id="save" class="primary">💾 保存全部</button>
        <button id="export" class="secondary">⬇ 导出规则</button>
        <button id="import" class="tertiary">⬆ 导入规则</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      <div id="status"></div>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
